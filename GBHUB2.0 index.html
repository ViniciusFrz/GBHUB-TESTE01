<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GB HUB 2.0</title>
<style>
:root{
  --navy-900:#071c3f;--navy-800:#0a2a5e;--blue-700:#0f3d8f;--blue-600:#1653b0;--blue-500:#1e5fc4;--blue-300:#5b9df0;
  --ice:#eaf2ff;--glass:rgba(255,255,255,.09);--glass-b:rgba(255,255,255,.20);
  --ok:#2ecc71;--warn:#f5a623;--bad:#e0563f;--muted:#a9bfe3;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1100px 700px at 12% 8%,#173f82 0%,transparent 60%),
    radial-gradient(900px 650px at 92% 85%,#0d2f66 0%,transparent 55%),
    linear-gradient(160deg,var(--navy-900),var(--blue-700) 55%,var(--navy-800));
  color:var(--ice);min-height:100%;position:relative;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
}
html{scroll-padding-top:env(safe-area-inset-top,0)}
.blob{position:fixed;border-radius:999px;filter:blur(50px);opacity:.30;z-index:0;pointer-events:none}
.blob1{width:380px;height:380px;top:-100px;left:-100px;background:linear-gradient(135deg,#3b82f6,#1e40af)}
.blob2{width:340px;height:340px;bottom:-120px;right:-100px;background:linear-gradient(135deg,#60a5fa,#1d4ed8)}
.blob3{width:220px;height:220px;top:40%;right:8%;background:linear-gradient(135deg,#38bdf8,#1e3a8a)}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px);border-radius:16px}
a,button{font-family:inherit}
h1,h2,h3{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:12px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.94);color:#0a2a5e;font-size:14px;outline:none}
textarea{resize:vertical;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.btn{background:var(--navy-900);color:#fff;border:1px solid rgba(255,255,255,.25);padding:11px 18px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{background:var(--blue-700)}
.btn.primary{background:var(--blue-500)}
.btn.primary:hover{background:var(--blue-600)}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--ice);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn-outline:hover{background:rgba(255,255,255,.1)}
.btn.sm,.btn-outline.sm{padding:6px 10px;font-size:12.5px}
/* ---- login ---- */
.login-wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(400px,94vw);padding:36px 32px;text-align:center}
.logo{font-size:22px;font-weight:800;letter-spacing:.5px;margin-bottom:4px}
.logo span{color:var(--blue-300)}
.login-sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.hub-tag{text-align:center;font-weight:800;letter-spacing:3px;font-size:13px;color:var(--blue-300);margin-bottom:6px}
.login-card h2{text-align:left;font-size:20px}
.login-card label{text-align:left}
.pwd-wrap{position:relative}
.pwd-wrap button{position:absolute;right:6px;top:6px;background:none;border:none;color:#0a2a5e;cursor:pointer;font-size:16px;padding:4px 6px}
.err-msg{color:#ffb4a6;font-size:12.5px;margin-top:8px;min-height:16px}
.login-foot{margin-top:18px;color:var(--muted);font-size:11.5px}
/* ---- app shell ---- */
#appShell{position:relative;z-index:1}
.topbar{position:sticky;top:env(safe-area-inset-top,0);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(7,28,63,.55);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12);flex-wrap:wrap;gap:10px}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.brand-logo{height:30px;width:auto;display:block}
.brand span{color:var(--blue-300)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--ice);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600}
.tab-btn.active{background:var(--blue-500);border-color:var(--blue-500)}
.userbox{display:flex;align-items:center;gap:10px;font-size:13px}
.container{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.card{padding:20px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:8px}
.row input{flex:1}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:18px;text-align:center}
.stat .num{font-size:30px;font-weight:800}
.stat.ok .num{color:var(--ok)}
.stat.bad .num{color:var(--bad)}
.stat.warn .num{color:var(--warn)}
.stat.info .num{color:var(--blue-300)}
.barrow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.barrow span{width:150px;flex-shrink:0;color:var(--muted)}
.barbg{flex:1;background:rgba(255,255,255,.12);border-radius:6px;height:10px;overflow:hidden}
.bar{background:linear-gradient(90deg,var(--blue-500),var(--blue-300));height:100%;border-radius:6px}
.miniitem{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
/* badges */
.badge{padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.st-ok{background:rgba(46,204,113,.2);color:#6cf0a0}
.badge.st-bad{background:rgba(224,86,63,.2);color:#ff9a85}
.badge.st-warn{background:rgba(245,166,35,.2);color:#ffcb70}
.badge.st-pend{background:rgba(255,255,255,.15);color:var(--ice)}
.badge.st-prog{background:rgba(30,95,196,.28);color:#a9cdfb}
/* histórico */
.filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.filtros>div{flex:1;min-width:150px}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid rgba(255,255,255,.2)}
.table td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.table tr:hover td{background:rgba(255,255,255,.05)}
/* auditoria */
.auditbox{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.auditbox textarea{margin:8px 0}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,12,30,.6);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(520px,95vw);max-height:85vh;overflow-y:auto;padding:24px}
.modal .close{float:right;background:none;border:none;color:var(--ice);font-size:20px;cursor:pointer}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13.5px;gap:10px}
.kv b{text-align:right}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-900);border:1px solid var(--blue-500);color:#fff;padding:12px 20px;border-radius:10px;z-index:30;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.btn,.btn-outline,.tab-btn{transition:background .15s ease,transform .1s ease}
.btn:active,.btn-outline:active{transform:scale(.97)}
.btn-danger{background:transparent;border:1px solid rgba(224,86,63,.6);color:#ff9a85;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12.5px}
.btn-danger:hover{background:rgba(224,86,63,.15)}
.notif{background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px;font-size:10.5px;margin-left:5px;font-weight:800;vertical-align:2px}
.thumb{max-width:100%;border-radius:10px;margin-top:8px;display:block}
input[type=file]{padding:8px;font-size:12.5px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.container{}
.overlay{animation:fadeUp .15s ease}
.modal{animation:popIn .2s ease}
.toast{animation:fadeUp .25s ease}
.card{transition:box-shadow .15s ease}
.miniitem,.auditbox{transition:background .15s ease}
.miniitem:hover,.auditbox:hover{background:rgba(255,255,255,.04)}
.loading-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative;z-index:1}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--blue-300);border-radius:50%;animation:spin .8s linear infinite}
.warnbar{background:rgba(245,166,35,.18);border:1px solid rgba(245,166,35,.4);padding:10px 16px;border-radius:10px;font-size:12.5px;margin-bottom:14px}
.cliente-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-left:3px solid var(--blue-500);border-radius:14px;padding:14px 16px;margin-bottom:12px;transition:background .15s ease}
.cliente-card:hover{background:rgba(255,255,255,.09)}
.cliente-card.is-cancelado{border-left-color:var(--bad)}
.cliente-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.cliente-nome{font-size:16px;font-weight:700}
.plano-pill{background:rgba(30,95,196,.25);color:#a9cdfb;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.cliente-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.cliente-label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.cliente-valor{display:block;font-size:13.5px;font-weight:600}
</style>

.gh-grid{display:grid;gap:14px}.gh-grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.gh-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.gh-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}

/* neutraliza a camada visual antiga sem remover seus componentes funcionais */
.glass,.card{background:#fff!important;border:1px solid var(--border)!important;box-shadow:var(--shadow)!important;backdrop-filter:none!important;color:var(--text)!important;border-radius:var(--radius)!important}.muted{color:var(--text-3)!important}.btn{border-radius:8px!important}.btn.primary{background:var(--primary)!important}.btn-outline{border-color:var(--border)!important;color:var(--text-2)!important;background:#fff!important}.topbar{display:none!important}.container{max-width:none!important;margin:0!important;padding:0!important}.badge{border-radius:6px!important}

@media(max-width:820px){.gh-sidebar{transform:translateX(-100%)}.gh-sidebar.open{transform:translateX(0)}.gh-main{margin-left:0}.gh-menu{display:grid}.gh-topbar{padding:0 15px;height:64px}.gh-content{padding:18px 15px 84px}.gh-search{display:none}.gh-page-title{min-width:0}.gh-page-title strong{font-size:15px}.gh-page-title span{font-size:10px}.gh-grid-3,.gh-grid-2,.gh-detail-grid{grid-template-columns:1fr}.gh-grid-4{grid-template-columns:1fr 1fr}.gh-form-2,.gh-form-3{grid-template-columns:1fr}.gh-mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--border);z-index:25;padding-bottom:env(safe-area-inset-bottom)}.gh-mobile-nav button{border:0;background:transparent;color:var(--text-3);font:650 9px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.gh-mobile-nav button.active{color:var(--primary)}.gh-overlay.show{display:block;position:fixed;inset:0;background:rgba(7,22,38,.35);z-index:29}}
@media(max-width:520px){.gh-grid-4{grid-template-columns:1fr}.gh-section-head{align-items:flex-start;flex-direction:column}.gh-actions{width:100%}.gh-actions .gh-btn{flex:1}.gh-kpi-value{font-size:23px}}

function today(){return new Date().toISOString().slice(0,10)}

function slaStatus(o){
  if(o.status==='Concluído') return 'concluido';
  if(!o.slaLimite) return 'none';
  const restante=o.slaLimite-Date.now();
  if(restante<0) return 'estourado';
  if(restante<2*3600000) return 'atencao';
  return 'ok';
}
function slaBadge(o){
  const s=slaStatus(o);
  if(s==='concluido') return '<span class="badge st-ok"> Concluída</span>';
  if(s==='ok') return '<span class="badge st-ok"> Dentro do prazo</span>';
  if(s==='atencao') return '<span class="badge st-warn"> Próx. vencimento</span>';
  if(s==='estourado') return '<span class="badge st-bad"> SLA estourado</span>';
  return '-';
}

function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=800, scale=Math.min(1,maxW/img.width);
      const canvas=document.createElement('canvas');
      canvas.width=img.width*scale; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.6));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
const EQUIPAMENTOS=['Fiberhome AN5506-04-FA','Huawei EG8145V5','ZTE F670L','Intelbras W5-1200G','TP-Link Archer C6','Nokia G-140W-C','Datacom DM984-419'];
function hashCode(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return h; }
function mulberry32(seed){ return function(){ seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^seed>>>15,1|seed); t=(t+Math.imul(t^t>>>7,61|t))^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function planoParaMbps(plano){ if(!plano) return 100; if(plano.includes('Giga')) return (parseFloat(plano)||1)*1000; return parseInt(plano)||100; }
function formatUptime(h){ const d=Math.floor(h/24), r=h%24; return (d>0?d+'d ':'')+r+'h'; }
function gerarExtrato(clienteId,plano,seedExtra){
  const rnd=mulberry32(hashCode(clienteId+':'+seedExtra));
  const los=rnd()<0.1;
  const online=!los && rnd()>0.08;
  const planoMbps=planoParaMbps(plano);
  const velocidade=online? Math.round(planoMbps*(0.65+rnd()*0.4)) : 0;
  const sinal=los? -30-Math.round(rnd()*5) : -(14+Math.round(rnd()*13));
  const tx=+(1+rnd()*3).toFixed(1);
  const oltRx=-(18+Math.round(rnd()*8));
  const pon=`0/${1+Math.floor(rnd()*4)}/${Math.floor(rnd()*8)}`;
  const onuId=1+Math.floor(rnd()*64);
  const serial=('HWTC'+Math.floor(rnd()*90000000+10000000)).toUpperCase();
  const equipamento=EQUIPAMENTOS[Math.floor(rnd()*EQUIPAMENTOS.length)];
  const horasOn=online? Math.floor(rnd()*220)+1 : 0;
  const ip=`100.${Math.floor(rnd()*255)}.${Math.floor(rnd()*255)}.${Math.floor(rnd()*255)}`;
  const mac=Array.from({length:6},()=>Math.floor(rnd()*256).toString(16).padStart(2,'0').toUpperCase()).join(':');
  let diagnostico;
  if(los) diagnostico='ONU sem comunicação óptica (LOS). Verifique fibra, conectores, CTO, alimentação da ONU e possível rompimento no enlace.';
  else if(!online) diagnostico='Equipamento aparentando estar desligado ou sem energia. Oriente o cliente a verificar a alimentação da ONU/roteador.';
  else if(sinal<-25) diagnostico='Sinal óptico abaixo do esperado. Verificar conectores, drop, CTO, curvaturas de fibra ou possíveis perdas no enlace.';
  else diagnostico='Sinal óptico dentro do padrão esperado. Conexão operando normalmente.';
  return {online,los,velocidade,planoMbps,sinal,tx,oltRx,pon,onuId,serial,equipamento,horasOn,ip,mac,diagnostico};
}
function formatCpfCnpj(raw){
  const d=(raw||'').replace(/\D/g,'').slice(0,14);
  let out='';
  if(d.length<=11){ for(let i=0;i<d.length;i++){ if(i===3||i===6) out+='.'; if(i===9) out+='-'; out+=d[i]; } }
  else { for(let i=0;i<d.length;i++){ if(i===2||i===5) out+='.'; if(i===8) out+='/'; if(i===12) out+='-'; out+=d[i]; } }
  return out;
}
function initAssinatura(){
  const canvas=document.getElementById('assinaturaCanvas'); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#0a2a5e'; ctx.lineWidth=2; ctx.lineCap='round';
  const existing=canvas.dataset.existing;
  if(existing){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src=existing; }
  let drawing=false, last=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches&&e.touches[0]; const cx=(t?t.clientX:e.clientX)-r.left; const cy=(t?t.clientY:e.clientY)-r.top; return {x:cx*canvas.width/r.width, y:cy*canvas.height/r.height}; }
  function start(e){ drawing=true; last=pos(e); canvas.dataset.dirty='1'; e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseleave=end;
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
}

/* ---------- FINANCEIRO: PIX (BR Code) e faturas ---------- */
function mesAtual(){ return new Date().toISOString().slice(0,7); }
function faturasDoCliente(id){ return faturas.filter(f=>f.clienteId===id).sort((a,b)=>(b.referencia||'').localeCompare(a.referencia||'')); }
function tlv(id,v){ return id+String(v.length).padStart(2,'0')+v; }
function crc16(str){
  let crc=0xFFFF;
  for(let i=0;i<str.length;i++){
    crc ^= str.charCodeAt(i)<<8;
    for(let j=0;j<8;j++){ crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1); crc&=0xFFFF; }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function gerarPixPayload({chave,nome,cidade,valor,txid}){
  const mai=tlv('26', tlv('00','BR.GOV.BCB.PIX')+tlv('01',(chave||'').trim()));
  const amt=valor? tlv('54', Number(valor).toFixed(2)) : '';
  const ref=tlv('05', (txid||'***').toString().replace(/[^A-Za-z0-9]/g,'').substring(0,25)||'***');
  let payload='000201'+mai+tlv('52','0000')+tlv('53','986')+amt+tlv('58','BR')+tlv('59',(nome||'GB ONLINE').substring(0,25))+tlv('60',(cidade||'SINOP').substring(0,15))+tlv('62',ref)+'6304';
  return payload+crc16(payload);
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const total=ordens.length;
  const byStatus={}; STATUS.forEach(s=>byStatus[s]=ordens.filter(o=>o.status===s).length);
  const byTipo={}; TIPOS.forEach(t=>byTipo[t]=ordens.filter(o=>o.tipo===t).length);
  const maxTipo=Math.max(1,...Object.values(byTipo));
  const recentes=[...ordens].sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0)).slice(0,6);
  const concluidasComTempo=ordens.filter(o=>o.status==='Concluído'&&o.checklist&&o.checklist.preenchidoEm&&o.criadoEm);
  const tempoMedioH=concluidasComTempo.length? (concluidasComTempo.reduce((s,o)=>s+(o.checklist.preenchidoEm-o.criadoEm),0)/concluidasComTempo.length/3600000).toFixed(1) : null;
  const emAberto=ordens.filter(o=>o.status!=='Concluído');
  const slaOk=emAberto.filter(o=>['ok','concluido'].includes(slaStatus(o))).length;
  const slaAtencao=emAberto.filter(o=>slaStatus(o)==='atencao').length;
  const slaEstourado=emAberto.filter(o=>slaStatus(o)==='estourado').length;
  const meses=Array.from({length:6},(_,i)=>{ const d=new Date(); d.setMonth(d.getMonth()-(5-i)); return d.toISOString().slice(0,7); });
  const receitaPorMes=meses.map(m=>({mes:m, valor:faturas.filter(f=>f.referencia===m&&f.status==='Paga').reduce((s,f)=>s+Number(f.valor||0),0)}));
  const maxReceita=Math.max(1,...receitaPorMes.map(r=>r.valor));
  return `
  <div class="stats">
    <div class="stat glass"><div class="num">${total}</div><div class="muted small">Total de O.S.</div></div>
    <div class="stat glass warn"><div class="num">${byStatus['Pendente']}</div><div class="muted small">Pendentes</div></div>
    <div class="stat glass info"><div class="num">${byStatus['Em resolução']}</div><div class="muted small">Em Resolução</div></div>
    <div class="stat glass ok"><div class="num">${byStatus['Concluído']}</div><div class="muted small">Concluídas</div></div>
    <div class="stat glass info"><div class="num">${tempoMedioH?tempoMedioH+'h':'-'}</div><div class="muted small">Tempo Médio de Resolução</div></div>
    <div class="stat glass ok"><div class="num"> ${slaOk}</div><div class="muted small">SLA Dentro do Prazo</div></div>
    <div class="stat glass warn"><div class="num"> ${slaAtencao}</div><div class="muted small">SLA Próximo do Vencimento</div></div>
    <div class="stat glass bad"><div class="num"> ${slaEstourado}</div><div class="muted small">SLA Estourado</div></div>
  </div>
  <div class="grid2">
    <div class="card glass"><h3>Atendimentos por Tipo</h3>${Object.entries(byTipo).map(([t,c])=>`<div class="barrow"><span title="${t}">${t}</span><div class="barbg"><div class="bar" style="width:${c/maxTipo*100}%"></div></div><b>${c}</b></div>`).join('')}</div>
    <div class="card glass"><h3>Últimos Atendimentos</h3>${recentes.length? recentes.map(o=>`<div class="miniitem"><div><b>${esc(o.nome)}</b><div class="muted small">${esc(o.tipo)} • ${fmtDate(o.data)}</div></div><span class="badge ${badgeClass(o.status)}">${o.status}</span></div>`).join(''):'<p class="muted small">Nenhum atendimento registrado ainda.</p>'}</div>
  </div>
  <div class="card glass"><h3>Receita Mensal (Faturas Pagas)</h3>${receitaPorMes.map(r=>`<div class="barrow"><span>${r.mes}</span><div class="barbg"><div class="bar" style="width:${r.valor/maxReceita*100}%"></div></div><b>R$ ${r.valor.toFixed(2)}</b></div>`).join('')}</div>`;
}

/* ---------- HISTÓRICO ---------- */
function ordensFiltradas(){
  const de=state.filtroDe, ate=state.filtroAte, texto=(state.filtroTexto||'').toLowerCase();
  return ordens.filter(o=>{
    if(de && o.data<de) return false;
    if(ate && o.data>ate) return false;
    if(texto && !((o.nome||'').toLowerCase().includes(texto)||(o.codigo||'').toLowerCase().includes(texto)||(o.documento||'').toLowerCase().includes(texto))) return false;
    return true;
  }).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
}
async function exportarCSV(){
  const lista=ordensFiltradas();
  if(!lista.length){ alert('Nenhuma O.S. para exportar com os filtros atuais.'); return; }
  const linhas=[['Data','Cliente','Codigo','Documento','Tipo','Status','Tecnico','Descricao'].join(';')];
  lista.forEach(o=>linhas.push([fmtDate(o.data),o.nome,o.codigo||'',o.documento||'',o.tipo,o.status,o.tecnico,(o.descricao||'').replace(/[;\n]/g,' ')].join(';')));
  const csv='\ufeff'+linhas.join('\n');
  try{
    const dl=await claude.use('downloads');
    if(dl){ await dl.save({filename:'ordens_servico_gbhub.csv', data:csv}); showToast('Relatório exportado!'); }
    else alert('Exportação de arquivos não disponível nesta visualização.');
  }catch(e){ if(e && e.code!=='declined') console.error(e); }
}

function renderAuditorTodos(){
  const sit=state.audFiltroSituacao||'todas';
  const de=state.audFiltroDe, ate=state.audFiltroAte, texto=(state.audFiltroTexto||'').toLowerCase();
  const lista=ordens.filter(o=>{
    if(sit==='aberto' && !(o.status==='Pendente'||o.status==='Em resolução')) return false;
    if(sit==='concluido' && o.status!=='Concluído') return false;
    if(de && o.data<de) return false;
    if(ate && o.data>ate) return false;
    if(texto && !((o.nome||'').toLowerCase().includes(texto)||(o.codigo||'').toLowerCase().includes(texto)||(o.documento||'').toLowerCase().includes(texto))) return false;
    return true;
  }).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
  return `
  <div class="card glass">
    <div class="filtros">
      <div><label>Situação</label><select id="audSit">
        <option value="todas" ${sit==='todas'?'selected':''}>Todas</option>
        <option value="aberto" ${sit==='aberto'?'selected':''}>Em Aberto</option>
        <option value="concluido" ${sit==='concluido'?'selected':''}>Concluídas</option>
      </select></div>
      <div><label>De</label><input type="date" id="audDe" value="${de}"></div>
      <div><label>Até</label><input type="date" id="audAte" value="${ate}"></div>
      <div><label>Cliente / Código / Documento</label><input id="audTexto" value="${esc(state.audFiltroTexto)}" placeholder="Buscar..."></div>
      <button class="btn" data-act="audFiltrar">Filtrar</button>
    </div>
  </div>
  <div class="card glass" style="overflow-x:auto">
    <table class="table"><thead><tr><th>Data</th><th>Cliente</th><th>Tipo</th><th>Técnico</th><th>Situação</th><th>Auditoria</th><th></th></tr></thead>
    <tbody>${lista.length? lista.map(o=>`<tr><td>${fmtDate(o.data)}</td><td>${esc(o.nome)}</td><td>${esc(o.tipo)}</td><td>${esc(o.tecnico)||'Não atribuído'}</td><td><span class="badge ${badgeClass(o.status)}">${o.status}</span></td><td>${auditBadge(o.auditoria)}</td><td><button class="btn-outline sm" data-act="ver" data-id="${o.id}">Detalhes</button></td></tr>`).join(''):'<tr><td colspan="7" class="muted">Nenhum atendimento encontrado.</td></tr>'}</tbody></table>

function render(){
  const root=document.getElementById('root');
  const active=document.activeElement;
  const focusedId=(active && active.id && root.contains(active))? active.id : null;
  const selStart=(focusedId && active.selectionStart!=null)? active.selectionStart : null;
  const snapshot={};
  root.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{ if(el.type==='file') return; snapshot[el.id]= el.type==='checkbox'?el.checked:el.value; });
  const logged = sessionStorage.getItem('gbhub_auth')==='1';
  const role = sessionStorage.getItem('gbhub_role');
  root.innerHTML = !dbReady ? renderLoading() : (logged ? (role==='auditor'?renderAuditorApp():renderApp()) : renderLogin());
  Object.keys(snapshot).forEach(id=>{
    const el=document.getElementById(id);
    if(el){ if(el.type==='checkbox') el.checked=snapshot[id]; else el.value=snapshot[id]; }
  });
  if(focusedId){ const el=document.getElementById(focusedId); if(el){ el.focus(); if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart,selStart); }catch(e){} } } }
  bind();
}
function renderLoading(){ return `<div class="loading-wrap"><div class="spinner"></div><div class="muted small">Carregando GB HUB 2.0...</div></div>`; }

function bind(){
  const loginForm=document.getElementById('loginForm');
  if(loginForm){
    document.getElementById('togglePwd').onclick=()=>{
      const p=document.getElementById('liSenha'); p.type = p.type==='password'?'text':'password';
    };
    loginForm.onsubmit=(e)=>{
      e.preventDefault();
      const em=document.getElementById('liEmail').value.trim().toLowerCase();
      const sn=document.getElementById('liSenha').value;
      let u=USERS[em];
      if(!u){ const extra=usuarios.find(x=>(x.email||'').toLowerCase()===em); if(extra) u=extra; }
      if(u && u.senha===sn){
        sessionStorage.setItem('gbhub_auth','1');
        sessionStorage.setItem('gbhub_role',u.role);
        sessionStorage.setItem('gbhub_nome',u.nome);
        sessionStorage.setItem('gbhub_email',em);
        render();
      } else{ document.getElementById('loginErr').textContent='Email ou senha incorretos.'; }
    };
    return;
  }
  const root=document.getElementById('root');
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; state.buscaMsg=''; if(state.tab!=='clients') state.ghClientForm=false; render(); });
  root.querySelectorAll('[data-audtab]').forEach(b=>b.onclick=()=>{ state.audTab=b.dataset.audtab; render(); });
  const logoutBtn=root.querySelector('[data-act="logout"]');
  if(logoutBtn) logoutBtn.onclick=()=>{ sessionStorage.removeItem('gbhub_auth'); sessionStorage.removeItem('gbhub_role'); sessionStorage.removeItem('gbhub_nome'); sessionStorage.removeItem('gbhub_email'); render(); };

  const buscarBtn=root.querySelector('[data-act="buscar"]');
  if(buscarBtn) buscarBtn.onclick=()=>{
    const q=document.getElementById('buscaCliente').value;
    const c=buscarCliente(q);
    if(c){ state.clienteVinculado=c; state.buscaMsg='Cliente vinculado: '+c.nome; }
    else{ state.clienteVinculado=null; state.buscaMsg='Cliente não encontrado. Cadastre-o para continuar.'; }
    render();
  };
  const buscaInput=document.getElementById('buscaCliente');
  if(buscaInput) buscaInput.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); buscarBtn.click(); } };
  const trocarBtn=root.querySelector('[data-act="trocarCliente"]');
  if(trocarBtn) trocarBtn.onclick=()=>{ state.clienteVinculado=null; state.buscaMsg=''; render(); };
  const irCadastroBtn=root.querySelector('[data-act="irCadastro"]');
  if(irCadastroBtn) irCadastroBtn.onclick=()=>{ state.tab='clientes'; render(); };

  const formOS=document.getElementById('formOS');
  if(formOS) formOS.onsubmit=async (e)=>{
    e.preventDefault();
    const cv=state.clienteVinculado;
    if(!cv){ alert('Selecione um cliente antes de criar a O.S.'); return; }
    const prioridade=document.getElementById('fPrioridade').value;
    const agora=Date.now();
    const ordem={
      nome:cv.nome, codigo:cv.codigo||'', documento:cv.documento||'',
      tipo:document.getElementById('fTipo').value,
      prioridade,
      slaLimite: agora + SLA_HORAS[prioridade]*3600000,
      tecnico:'',
      criadoPor:sessionStorage.getItem('gbhub_nome')||'',
      descricao:document.getElementById('fDescricao').value.trim(),
      data:document.getElementById('fData').value||today(),
      status:'Pendente',
      checklist:null,
      auditoria:{status:'nenhuma'},
      criadoEm:agora
    };
    await addOrdem(ordem);
    state.buscaMsg=''; state.clienteVinculado=null;
    showToast('Ordem de serviço criada com sucesso!');
    state.tab='dashboard'; render();
  };

  const formCliente=document.getElementById('formCliente');
  if(formCliente) formCliente.onsubmit=async (e)=>{
    e.preventDefault();
    const cliente={
      nome:document.getElementById('cNome').value.trim(),
      codigo:document.getElementById('cCodigo').value.trim(),
      idCliente:document.getElementById('cIdCliente').value.trim(),
      documento:document.getElementById('cDoc').value.trim(),
      loginPppoe:document.getElementById('cLogin').value.trim(),
      senhaPppoe:document.getElementById('cSenhaPppoe').value.trim(),
      plano:document.getElementById('cPlano').value,
      endereco:document.getElementById('cEndereco').value.trim(),
      telefone:document.getElementById('cTelefone').value.trim(),
      email:document.getElementById('cEmail').value.trim()
    };
    if(!cliente.codigo && !cliente.documento){ alert('Informe ao menos o código ou o CPF/CNPJ do cliente.'); return; }
    if(state.clienteEditId) cliente.id=state.clienteEditId;
    await upsertCliente(cliente);
    showToast(state.clienteEditId?'Cliente atualizado com sucesso!':'Cliente cadastrado com sucesso!');
    state.clienteEditId=null;
    formCliente.reset(); render();
  };
  const cDocInput=document.getElementById('cDoc');
  if(cDocInput) cDocInput.oninput=()=>{
    const pos=cDocInput.selectionStart, before=cDocInput.value.length;
    cDocInput.value=formatCpfCnpj(cDocInput.value);
    const diff=cDocInput.value.length-before;
    try{ cDocInput.setSelectionRange(pos+diff,pos+diff); }catch(err){}
  };
  root.querySelectorAll('[data-act="editarCliente"]').forEach(b=>b.onclick=()=>{ state.clienteEditId=b.dataset.id; window.scrollTo({top:0,behavior:'smooth'}); render(); });
  const cancelarEdCliBtn=root.querySelector('[data-act="cancelarEdicaoCliente"]');
  if(cancelarEdCliBtn) cancelarEdCliBtn.onclick=()=>{ state.clienteEditId=null; render(); };
  root.querySelectorAll('[data-act="abrirCancelamento"]').forEach(b=>b.onclick=()=>{ state.cancelamentoAbertoId=b.dataset.id; render(); });
  const voltarCancBtn=root.querySelector('[data-act="voltarCancelamento"]');
  if(voltarCancBtn) voltarCancBtn.onclick=()=>{ state.cancelamentoAbertoId=null; render(); };
  root.querySelectorAll('[data-act="confirmarCancelamento"]').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.id;
    const motivo=document.getElementById('cancelMotivo-'+id).value.trim();
    if(!motivo){ alert('Descreva o motivo do cancelamento.'); return; }
    await patchCliente(id,{cancelado:true, motivoCancelamento:motivo, dataCancelamento:Date.now()});
    state.cancelamentoAbertoId=null; showToast('Cadastro cancelado.'); render();
  });
  root.querySelectorAll('[data-act="reativarCliente"]').forEach(b=>b.onclick=async ()=>{
    await patchCliente(b.dataset.id,{cancelado:false, motivoCancelamento:null, dataCancelamento:null});
    showToast('Cadastro reativado.'); render();
  });

  const filtrarBtn=root.querySelector('[data-act="filtrar"]');
  if(filtrarBtn) filtrarBtn.onclick=()=>{
    state.filtroDe=document.getElementById('hDe').value;
    state.filtroAte=document.getElementById('hAte').value;
    state.filtroTexto=document.getElementById('hTexto').value;
    render();
  };
  const exportarBtn=root.querySelector('[data-act="exportarCSV"]');
  if(exportarBtn) exportarBtn.onclick=exportarCSV;
  const audFiltrarBtn=root.querySelector('[data-act="audFiltrar"]');
  if(audFiltrarBtn) audFiltrarBtn.onclick=()=>{
    state.audFiltroSituacao=document.getElementById('audSit').value;
    state.audFiltroDe=document.getElementById('audDe').value;
    state.audFiltroAte=document.getElementById('audAte').value;
    state.audFiltroTexto=document.getElementById('audTexto').value;
    render();
  };
  root.querySelectorAll('[data-act="ver"]').forEach(b=>b.onclick=()=>{ state.modalId=b.dataset.id; state.modalStatusDraft=null; state.modalAuditOpen=false; pendingFotoUrl=null; render(); });
  root.querySelectorAll('[data-act="fecharModal"]').forEach(b=>b.onclick=()=>{ state.modalId=null; state.modalStatusDraft=null; state.modalAuditOpen=false; pendingFotoUrl=null; render(); });
  const statusSelect=document.getElementById('statusSelect');
  if(statusSelect) statusSelect.onchange=()=>{ state.modalStatusDraft=statusSelect.value; render(); };
  const salvarBtn=root.querySelector('[data-act="salvarStatus"]');
  if(salvarBtn) salvarBtn.onclick=async ()=>{
    const id=salvarBtn.dataset.id;
    const novoStatus=document.getElementById('statusSelect').value;
    const patch={status:novoStatus};
    if(novoStatus==='Concluído'){
      const ordemAtual=ordens.find(x=>x.id===id);
      const canvasAssin=document.getElementById('assinaturaCanvas');
      const assinaturaUrl = (canvasAssin && canvasAssin.dataset.dirty==='1') ? canvasAssin.toDataURL('image/png') : (ordemAtual&&ordemAtual.checklist? ordemAtual.checklist.assinaturaUrl:null) || null;
      patch.checklist={
        conexao:document.getElementById('ckConexao').value,
        sinal:document.getElementById('ckSinal').value,
        equipamento:document.getElementById('ckEquip').value,
        causa:document.getElementById('ckCausa').value.trim(),
        observacoesFinais:document.getElementById('ckObs').value.trim(),
        fotoUrl:pendingFotoUrl || (ordemAtual&&ordemAtual.checklist? ordemAtual.checklist.fotoUrl:null) || null,
        assinaturaUrl,
        preenchidoEm:Date.now()
      };
    }
    await patchOrdem(id,patch);
    state.modalId=null; state.modalStatusDraft=null; pendingFotoUrl=null;
    showToast('Situação da O.S. atualizada.'); render();
  };
  const ckFotoInput=document.getElementById('ckFoto');
  if(ckFotoInput) ckFotoInput.onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    compressImage(file, dataUrl=>{ pendingFotoUrl=dataUrl; showToast('Foto anexada. Clique em Salvar Situação para confirmar.'); });
  };
  initAssinatura();
  const limparAssinBtn=root.querySelector('[data-act="limparAssinatura"]');
  if(limparAssinBtn) limparAssinBtn.onclick=()=>{
    const c=document.getElementById('assinaturaCanvas'); if(!c) return;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    c.dataset.dirty='1'; c.dataset.existing='';
  };
  const iaBtn=root.querySelector('[data-act="iaResumo"]');
  if(iaBtn) iaBtn.onclick=async ()=>{
    const id=iaBtn.dataset.id;
    const o=ordens.find(x=>x.id===id); if(!o) return;
    const causa=document.getElementById('ckCausa').value.trim();
    const obsAtual=document.getElementById('ckObs').value.trim();
    const conexao=document.getElementById('ckConexao').value;
    const textoOriginal=iaBtn.textContent;
    iaBtn.disabled=true; iaBtn.textContent='Gerando...';
    try{
      const sample=await claude.use('sample');
      if(!sample){ alert('Assistente de IA indisponível nesta visualização.'); iaBtn.disabled=false; iaBtn.textContent=textoOriginal; return; }
      const prompt='Você é assistente de um técnico de internet da provedora GB Online. Com base nestas anotações rápidas do técnico, escreva um resumo profissional e objetivo (3 a 5 frases corridas, em português, sem markdown e sem títulos) do atendimento, para constar no registro oficial da O.S.\n\nTipo de atendimento: '+o.tipo+'\nRelato do cliente: '+(o.descricao||'-')+'\nConexão restabelecida: '+conexao+'\nCausa identificada: '+(causa||'não informada')+'\nAnotações do técnico: '+(obsAtual||'não informadas');
      const res=await sample(prompt,{onText:({text})=>{ const ta=document.getElementById('ckObs'); if(ta) ta.value=text; }});
      const ta=document.getElementById('ckObs'); if(ta) ta.value=res.text;
    }catch(e){ console.error(e); alert('Não foi possível gerar o resumo agora.'); }
    iaBtn.disabled=false; iaBtn.textContent=textoOriginal;
  };
  const excluirOSBtn=root.querySelector('[data-act="excluirOS"]');
  if(excluirOSBtn) excluirOSBtn.onclick=async ()=>{
    if(!confirm('Excluir esta O.S.? Esta ação não pode ser desfeita.')) return;
    await deleteDoc('ordens', excluirOSBtn.dataset.id);
    state.modalId=null; showToast('O.S. excluída.'); render();
  };
  const assumirBtn=root.querySelector('[data-act="assumirOS"]');
  if(assumirBtn) assumirBtn.onclick=async ()=>{
    await patchOrdem(assumirBtn.dataset.id,{status:'Em resolução', tecnico:sessionStorage.getItem('gbhub_nome')||'', assumidoEm:Date.now()});
    state.modalStatusDraft='Em resolução';
    showToast('Você assumiu esta O.S.!'); render();
  };
  root.querySelectorAll('[data-act="assumirOSRapido"]').forEach(b=>b.onclick=async (e)=>{
    e.stopPropagation();
    await patchOrdem(b.dataset.id,{status:'Em resolução', tecnico:sessionStorage.getItem('gbhub_nome')||'', assumidoEm:Date.now()});
    showToast('Você assumiu esta O.S.!'); render();
  });
  const abrirAuditBtn=root.querySelector('[data-act="abrirAuditoria"]');
  if(abrirAuditBtn) abrirAuditBtn.onclick=()=>{ state.modalAuditOpen=true; render(); };
  const cancelarAuditBtn=root.querySelector('[data-act="cancelarAuditoria"]');
  if(cancelarAuditBtn) cancelarAuditBtn.onclick=()=>{ state.modalAuditOpen=false; render(); };
  const confirmarAuditBtn=root.querySelector('[data-act="confirmarAuditoria"]');
  if(confirmarAuditBtn) confirmarAuditBtn.onclick=async ()=>{
    const motivo=document.getElementById('auditMotivo').value.trim();
    if(!motivo){ alert('Descreva o motivo antes de confirmar.'); return; }
    await patchOrdem(confirmarAuditBtn.dataset.id,{auditoria:{status:'pendente',motivo,dataMarcacao:Date.now()}});
    const role=sessionStorage.getItem('gbhub_role')||'tecnico';
    state.modalId=null; state.modalAuditOpen=false; state.modalStatusDraft=null;
    if(role==='auditor') state.audTab='todos';
    showToast('Auditoria registrada com sucesso.'); render();
  };
  const responderAuditModalBtn=root.querySelector('[data-act="responderAuditoriaModal"]');
  if(responderAuditModalBtn) responderAuditModalBtn.onclick=async ()=>{
    const id=responderAuditModalBtn.dataset.id;
    const val=document.getElementById('respostaAuditoria').value.trim();
    if(!val){ alert('Escreva sua justificativa antes de enviar.'); return; }
    const atual=ordens.find(o=>o.id===id);
    await patchOrdem(id,{auditoria:{...atual.auditoria, status:'respondida', resposta:val, dataResposta:Date.now()}});
    showToast('Resposta enviada para avaliação da auditoria.'); render();
  };
  root.querySelectorAll('[data-act="julgarAuditoria"]').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.id, resultado=b.dataset.resultado;
    const atual=ordens.find(o=>o.id===id);
    await patchOrdem(id,{auditoria:{...atual.auditoria, status:'concluida', resultado, dataConclusao:Date.now()}});
    state.modalId=null;
    showToast('Auditoria concluída como '+(resultado==='valido'?'Válida':'Não Válida')+'.'); render();
  });

  const salvarPixBtn=root.querySelector('[data-act="salvarPixChave"]');
  if(salvarPixBtn) salvarPixBtn.onclick=async ()=>{
    const chave=document.getElementById('finPixChave').value.trim();
    if(!chave){ alert('Informe a chave PIX.'); return; }
    if(db) await db.doc('config/pix').set({chave});
    else { configPix={chave}; render(); }
    showToast('Chave PIX salva!'); render();
  };
  const finBuscaInput=document.getElementById('finBusca');
  if(finBuscaInput) finBuscaInput.oninput=()=>{ const v=finBuscaInput.value; debounce('finBusca',()=>{ state.finBuscaTexto=v; render(); }); };
  const extratoBuscaInput=document.getElementById('extratoBusca');
  if(extratoBuscaInput) extratoBuscaInput.oninput=()=>{ const v=extratoBuscaInput.value; debounce('extratoBusca',()=>{ state.extratoBusca=v; render(); }); };
  root.querySelectorAll('[data-act="selExtrato"]').forEach(el=>el.onclick=()=>{ state.extratoClienteId=el.dataset.id; state.extratoSeed=0; render(); });
  const atualizarExtratoBtn=root.querySelector('[data-act="atualizarExtrato"]');
  if(atualizarExtratoBtn) atualizarExtratoBtn.onclick=()=>{ state.extratoSeed++; render(); };
  root.querySelectorAll('[data-act="toggleFin"]').forEach(b=>b.onclick=()=>{
    state.finClienteId = state.finClienteId===b.dataset.id? null : b.dataset.id;
    state.pixFaturaId=null; state.pixCodigo=null; render();
  });
  root.querySelectorAll('[data-act="gerarFatura"]').forEach(b=>b.onclick=async ()=>{
    const c=clientes.find(x=>x.id===b.dataset.id); if(!c) return;
    const valor=PLANO_VALORES[c.plano]||0;
    const hoje=new Date(); const venc=new Date(hoje.getFullYear(),hoje.getMonth(),10).toISOString().slice(0,10);
    const fatura={clienteId:c.id, clienteNome:c.nome, clienteDoc:c.documento||'', plano:c.plano||'', valor, vencimento:venc, referencia:mesAtual(), status:'Aberta', criadoEm:Date.now()};
    if(db) await db.collection('faturas').add(fatura);
    else { fatura.id='local_'+Date.now(); faturas.push(fatura); render(); }
    showToast('Fatura gerada!');
  });
  root.querySelectorAll('[data-act="gerarPix"]').forEach(b=>b.onclick=()=>{
    const f=faturas.find(x=>x.id===b.dataset.id); if(!f) return;
    if(!configPix.chave){ alert('Configure a chave PIX no topo da página antes de gerar o código.'); return; }
    state.pixFaturaId=f.id;
    state.pixCodigo=gerarPixPayload({chave:configPix.chave, nome:f.clienteNome, cidade:'SINOP', valor:f.valor, txid:f.id});
    render();
  });
  root.querySelectorAll('[data-act="baixarFaturaPdf"]').forEach(b=>b.onclick=()=>{
    const f=faturas.find(x=>x.id===b.dataset.id); if(!f) return;
    const c=clientes.find(x=>x.id===f.clienteId)||{nome:f.clienteNome,codigo:'',documento:f.clienteDoc,plano:f.plano};
    baixarFaturaPDF(f,c);
  });
  root.querySelectorAll('[data-act="marcarPaga"]').forEach(b=>b.onclick=async ()=>{
    await patchDocGenerico('faturas', b.dataset.id, {status:'Paga', dataPagamento:Date.now()});
    state.pixFaturaId=null; showToast('Fatura marcada como paga.'); render();
  });
  const gerarTodasBtn=root.querySelector('[data-act="gerarTodasFaturas"]');
  if(gerarTodasBtn) gerarTodasBtn.onclick=async ()=>{
    gerarTodasBtn.disabled=true; gerarTodasBtn.textContent='Gerando...';
    const mesRef=mesAtual();
    const ativos=clientes.filter(c=>!c.cancelado && c.plano);
    let criadas=0;
    for(const c of ativos){
      if(faturas.some(f=>f.clienteId===c.id && f.referencia===mesRef)) continue;
      const valor=PLANO_VALORES[c.plano]||0;
      const hoje=new Date(); const venc=new Date(hoje.getFullYear(),hoje.getMonth(),10).toISOString().slice(0,10);
      const fatura={clienteId:c.id, clienteNome:c.nome, clienteDoc:c.documento||'', plano:c.plano||'', valor, vencimento:venc, referencia:mesRef, status:'Aberta', criadoEm:Date.now()};
      if(db) await db.collection('faturas').add(fatura); else { fatura.id='local_'+Date.now()+criadas; faturas.push(fatura); }
      criadas++;
    }
    if(!db) render();
    gerarTodasBtn.disabled=false; gerarTodasBtn.textContent='⚡ Gerar Faturas do Mês';
    showToast(criadas+' fatura(s) gerada(s) para '+mesRef+'.');
  };
  const baixarOSPdfBtn=root.querySelector('[data-act="baixarOSPdf"]');
  if(baixarOSPdfBtn) baixarOSPdfBtn.onclick=()=>{ const o=ordens.find(x=>x.id===baixarOSPdfBtn.dataset.id); if(o) baixarOSPDF(o); };
  const formEquipe=document.getElementById('formEquipe');
  if(formEquipe) formEquipe.onsubmit=async (e)=>{
    e.preventDefault();
    const novo={nome:document.getElementById('eqNome').value.trim(), email:document.getElementById('eqEmail').value.trim().toLowerCase(), senha:document.getElementById('eqSenha').value, role:document.getElementById('eqRole').value};
    if(USERS[novo.email] || usuarios.some(u=>u.email===novo.email)){ alert('Já existe um login com este email.'); return; }
    if(db) await db.collection('usuarios').add(novo); else { novo.id='local_'+Date.now(); usuarios.push(novo); render(); }
    showToast('Membro adicionado à equipe!'); formEquipe.reset(); render();
  };
  root.querySelectorAll('[data-act="removerUsuario"]').forEach(b=>b.onclick=async ()=>{
    if(!confirm('Remover este membro da equipe? Ele não poderá mais fazer login.')) return;
    await deleteDoc('usuarios', b.dataset.id); showToast('Membro removido.'); render();
  });
  const copiarPixBtn=root.querySelector('[data-act="copiarPix"]');
  if(copiarPixBtn) copiarPixBtn.onclick=()=>{
    const ta=document.getElementById('pixTexto');
    try{ navigator.clipboard.writeText(state.pixCodigo||''); showToast('Código PIX copiado!'); }
    catch(e){ if(ta){ ta.select(); document.execCommand('copy'); showToast('Código PIX copiado!'); } }
  };
  const pixQrDiv=document.getElementById('pixQr');
  if(pixQrDiv && state.pixCodigo && typeof QRCode!=='undefined'){ pixQrDiv.innerHTML=''; new QRCode(pixQrDiv,{text:state.pixCodigo,width:170,height:170}); }
}

initStore();
</script>
</body>
</html>
